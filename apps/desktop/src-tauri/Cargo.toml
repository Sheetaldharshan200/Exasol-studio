[package]
name = "exasol-studio"
version = "0.1.0"
description = "Exasol Studio desktop backend"
authors = ["Exasol Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "exasol_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx-exasol = { version = "0.9.2", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "compression",
    "chrono",
    "rust_decimal",
    "uuid",
] }
futures-util = "0.3"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
