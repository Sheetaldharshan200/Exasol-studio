<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Exasol Studio</title>
    <meta
      name="description"
      content="Desktop-native Exasol workbench for SQL, diagnostics, AI, and architecture-aware workflows."
    />
    <script>
      // Apply the saved theme BEFORE first paint so no window ever flashes
      // white (matches theme-provider.tsx's storage key + fallback).
      (function () {
        try {
          var t = localStorage.getItem("exasol-studio-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      /* Pre-React boot screen: theme-matched background + the Exasol X mark
         pulsing until main.tsx dismisses it. Inline so it needs no bundle. */
      html { background: #ffffff; }
      html.dark { background: #0a0a0b; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.2s ease;
      }
      html.dark #boot { background: #0a0a0b; }
      #boot svg { width: 64px; height: 64px; animation: boot-pulse 1.6s ease-in-out infinite; }
      #boot .boot-trail { fill: #0b1730; }
      html.dark #boot .boot-trail { fill: #ededee; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 250 250" fill="none">
        <path class="boot-trail" d="M169.575 33.6724L134.68 79.5116L161.797 114.671L223.871 33.759L169.575 33.6724ZM161.797 135.548L134.68 170.695L169.575 216.534L223.871 216.46L161.797 135.548Z" />
        <path fill="#4fb58a" d="M27.2866 216.538L97.936 124.948L27.6179 33.79L81.8793 33.8217L152.172 124.946L81.531 216.535L27.2866 216.538Z" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
