name: CI

# The merge gate: every PR (and main) must typecheck, build the real frontend
# bundle, and pass the full test suite — JS on one runner, Rust on another —
# before it can land. Branch protection requires both jobs, so a red main is
# impossible instead of merely unlikely.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: Typecheck, build & JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (desktop)
        run: pnpm run typecheck:desktop

      - name: Build frontend (vite production bundle)
        run: pnpm --dir ./apps/desktop exec vite build

      - name: Desktop tests
        run: pnpm run test:desktop

      - name: Agent-core tests
        run: pnpm run test:agent-core

      - name: SQL parser tests
        run: pnpm run test:parser

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # tauri-build's build.rs verifies frontendDist and every bundle resource
      # path exists. The tests never execute those files — the release
      # workflow builds them for real — so empty stand-ins satisfy build.rs
      # without pulling the whole JS/runtime pipeline into this job.
      - name: Stub frontend dist and bundle resources
        run: |
          mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html
          mkdir -p packages/agent-core/dist/skills
          touch packages/agent-core/dist/agent-core.cjs \
                packages/agent-core/dist/mcp-gateway.cjs \
                packages/agent-core/dist/exa-agent.cjs
          mkdir -p apps/desktop/src-tauri/resources/runtime \
                   apps/desktop/src-tauri/resources/python-stack

      - name: cargo test
        run: cargo test --manifest-path ./apps/desktop/src-tauri/Cargo.toml
