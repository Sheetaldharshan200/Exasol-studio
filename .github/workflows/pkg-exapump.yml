name: pkg / exapump

on:
  schedule:
    - cron: "0 7 * * 1" # Mon 07:00 UTC
  workflow_dispatch:

concurrency:
  group: pkg-exapump
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build-package.yml
    with:
      id: exapump
      repo: exasol-labs/exapump
      kind: mirror
