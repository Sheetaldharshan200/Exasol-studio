name: pkg / agent-skills

on:
  schedule:
    - cron: "0 7 * * 2" # Tue 07:00 UTC
  workflow_dispatch:

concurrency:
  group: pkg-agent-skills
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build-package.yml
    with:
      id: agent-skills
      repo: exasol-labs/exasol-agent-skills
      kind: mirror
