name: Marketplace mirror (weekly)

# Weekly job that builds installable artifacts for the Marketplace catalog and
# publishes them to THIS repo's releases. Exasol Studio's Marketplace prefers
# an upstream release; when an upstream project has none, it can fall back to
# the artifacts produced here (tag: marketplace-latest).
#
# - Python packages (pyexasol, exasol-mcp-server) -> wheels (.whl)
# - Any project shipping a Rust/Go binary can be added to the `binaries` matrix
#   to emit a platform executable (.exe on Windows).

on:
  schedule:
    - cron: "0 5 * * 1" # every Monday 05:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write

jobs:
  wheels:
    name: Build Python wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - pyexasol
          - exasol-mcp-server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build wheel for ${{ matrix.package }}
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p dist
          # Resolve the package (and its deps) as wheels so the Marketplace can
          # install offline without touching PyPI at install time.
          uv pip download "${{ matrix.package }}" --dest dist --only-binary=:all: || \
          uv pip download "${{ matrix.package }}" --dest dist
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}
          path: dist/*

  binaries:
    name: Build ${{ matrix.name }} (${{ matrix.os }})
    # No-op by default; add real build steps per tool as they gain a buildable
    # source in this repo. Kept here so the platform/exe matrix is ready.
    if: false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: exapump
            os: ubuntu-latest
          - name: exapump
            os: windows-latest
          - name: exapump
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Add the ${{ matrix.name }} build command here."

  publish:
    name: Publish to marketplace-latest release
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" -o -name "*.exe" \) -exec cp {} release/ \;
          ls -la release

      - name: Publish / refresh the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marketplace-latest
          name: Marketplace artifacts (auto-built)
          body: |
            Rolling, auto-built Marketplace artifacts refreshed weekly.
            These are provided as a fallback when an upstream project has no
            release of its own. Do not rely on individual asset checksums being
            stable across runs.
          files: release/*
          prerelease: true
