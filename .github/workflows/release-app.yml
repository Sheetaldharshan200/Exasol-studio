name: Release app (all platforms)

# Builds every distribution of Exasol Studio: macOS (Apple Silicon + Intel),
# Windows (x64 + arm64) and Linux (x64 + arm64). Runs only on a version tag or
# a manual dispatch — never on ordinary pushes — so the pricey macOS/Windows
# runners are used sparingly. Rust + pnpm caches keep repeat builds cheap.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-app-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - label: macOS (Intel)
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - label: Linux arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: pnpm install --frozen-lockfile

      # Regression bank: every field-captured agent failure, replayed. A red
      # here means a reliability fix regressed — the build must not ship.
      - name: Agent evals
        run: pnpm --filter @exasol-studio/agent-core evals

      # Bundle the platform runtime (Node + llama.cpp engine) into the app so a
      # shipped build needs zero runtime downloads. All platform specifics live
      # in scripts/fetch-runtime.mjs — a new target only needs a matrix entry
      # above plus its row in that script, never any app code.
      - name: Bundle platform runtime
        run: node scripts/fetch-runtime.mjs ${{ matrix.target }}

      - name: Build & publish (draft release)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (enables signed auto-update artifacts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS notarization: to enable, add the APPLE_* env block here AND the
          # matching repo secrets (see workflows/README.md). Left out by default
          # because tauri-action attempts (and fails) codesign when the vars are
          # present but empty.
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Exasol Studio ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
