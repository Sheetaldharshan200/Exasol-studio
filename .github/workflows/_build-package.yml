name: _build-package (reusable)

# Shared logic for every Marketplace item. A tiny `check` job compares the
# upstream latest tag against what we last mirrored (stored in the mirror
# release body as `version=<tag>`). The expensive `build` job runs ONLY when
# the upstream version changed — so a week with no upstream release costs just
# the few seconds of the check. Each item repo gets its own thin caller
# workflow (pkg-*.yml); to onboard/patch a repo you only touch that one file.

on:
  workflow_call:
    inputs:
      id:
        description: Marketplace item id (also the mirror tag suffix)
        required: true
        type: string
      repo:
        description: Upstream GitHub repo (owner/name)
        required: true
        type: string
      kind:
        description: '"wheel" (build a Python wheel via uv) or "mirror" (copy upstream release assets)'
        required: true
        type: string
      package:
        description: PyPI package name (for kind=wheel)
        required: false
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.v.outputs.upstream }}
      changed: ${{ steps.v.outputs.changed }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upstream=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ inputs.repo }}/releases/latest" | jq -r '.tag_name // "none"')
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          last=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/mirror-${{ inputs.id }}" \
            | jq -r '.body // ""' | sed -n 's/.*version=\([^ ]*\).*/\1/p')
          if [ "$upstream" = "$last" ] && [ "$upstream" != "none" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ inputs.id }} already mirrored at $upstream — skipping build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ inputs.id }} upstream=$upstream last=$last — building."
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Build wheel (uv)
        if: inputs.kind == 'wheel'
        uses: astral-sh/setup-uv@v5
      - name: Resolve wheel + deps
        if: inputs.kind == 'wheel'
        run: |
          set -euxo pipefail
          mkdir -p dist
          uv pip download "${{ inputs.package }}" --dest dist --only-binary=:all: \
            || uv pip download "${{ inputs.package }}" --dest dist

      - name: Mirror upstream release assets
        if: inputs.kind == 'mirror'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ inputs.repo }}/releases/latest" \
            | jq -r '.assets[].browser_download_url' > urls.txt
          if [ -s urls.txt ]; then (cd dist && xargs -n1 curl -fsSLO < ../urls.txt); fi
          echo "Mirrored $(ls -1 dist | wc -l) asset(s)."

      - name: Publish to our mirror release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirror-${{ inputs.id }}
          name: ${{ inputs.id }} (mirror of ${{ inputs.repo }})
          body: |
            Auto-mirrored from ${{ inputs.repo }}.
            version=${{ needs.check.outputs.upstream }}
          files: dist/*
          prerelease: true
