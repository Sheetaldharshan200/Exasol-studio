name: Update marketplace catalog

# Produces marketplace/catalog.json — the single source of truth the app reads
# for the latest version of every item and whether an update is available.
# Trust model: "latest" is ALWAYS the real upstream release tag — the app must
# never show a stale version while an official release exists (that hid MCP
# Server 2.2.0 behind the 2.0.0 pin). For components pinned in the VALIDATED
# runtime-components.lock.json (Exasol Personal, ExaPump, MCP Server) the lock
# version is published separately as "verified" — the baseline the compatibility
# matrix approved and the one Revert returns to; installs of anything newer stay
# digest-verified in the app (verify-or-refuse).
# One cheap ubuntu job; commits only when the catalog actually changed. Runs
# after the weekly package builds (Wed) and on demand.

on:
  schedule:
    - cron: "0 8 * * 3" # Wed 08:00 UTC (after Mon/Tue package builds)
  workflow_dispatch:

concurrency:
  group: update-catalog
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write # the refresh lands via a reviewed PR (main is protected)

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build catalog.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # id|upstream repo|homepage
          items=$(cat <<'EOF'
          exasol-personal|exasol/exasol-personal|https://github.com/exasol/exasol-personal
          exasol-cloud|exasol/exasol-personal|https://github.com/exasol/exasol-personal
          exasol-community|exasol/docker-db|https://github.com/exasol/docker-db
          notebook-connector|exasol/notebook-connector|https://github.com/exasol/notebook-connector
          dbt-exasol|exasol/dbt-exasol|https://github.com/exasol/dbt-exasol
          exasol-scheduler|exasol-labs/exasol-scheduler|https://github.com/exasol-labs/exasol-scheduler
          dash-server|exasol-labs/dash-server|https://github.com/exasol-labs/dash-server
          grafana-datasource|exasol-labs/grafana-datasource|https://github.com/exasol-labs/grafana-datasource
          tableau-connector|exasol/tableau-connector|https://github.com/exasol/tableau-connector
          terraform-provider|exasol-labs/terraform-provider-exasol|https://github.com/exasol-labs/terraform-provider-exasol
          postgres-interface|exasol-labs/exa-postgres-interface|https://github.com/exasol-labs/exa-postgres-interface
          mongodb-vs|exasol-labs/exasol-mongodb-vs|https://github.com/exasol-labs/exasol-mongodb-vs
          more-functions|exasol-labs/more-functions|https://github.com/exasol-labs/more-functions
          exapump|exasol-labs/exapump|https://github.com/exasol-labs/exapump
          mcp-server|exasol/mcp-server|https://github.com/exasol/mcp-server
          pyexasol|exasol/pyexasol|https://github.com/exasol/pyexasol
          sqlalchemy-exasol|exasol/sqlalchemy-exasol|https://github.com/exasol/sqlalchemy-exasol
          json-tables|exasol-labs/exasol-json-tables|https://github.com/exasol-labs/exasol-json-tables
          ai-lab|exasol/ai-lab|https://github.com/exasol/ai-lab
          agent-skills|exasol-labs/exasol-agent-skills|https://github.com/exasol-labs/exasol-agent-skills
          semantic-views|exasol-labs/exasol-semantic-views|https://github.com/exasol-labs/exasol-semantic-views
          exarrow-rs|exasol-labs/exarrow-rs|https://github.com/exasol-labs/exarrow-rs
          driver-ts|exasol/exasol-driver-ts|https://github.com/exasol/exasol-driver-ts
          driver-go|exasol/exasol-driver-go|https://github.com/exasol/exasol-driver-go
          driver-websocket|exasol/websocket-api|https://github.com/exasol/websocket-api
          superset|apache/superset|https://github.com/apache/superset
          EOF
          )
          echo '{' > catalog.json
          echo "  \"generatedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> catalog.json
          echo "  \"mirrorRepo\": \"${{ github.repository }}\"," >> catalog.json
          echo '  "items": {' >> catalog.json
          first=1
          while IFS='|' read -r id repo homepage; do
            [ -z "$id" ] && continue
            # "verified" = the validated lock pin (managed components only) —
            # the baseline Revert returns to. It never masks "latest".
            verified=$(jq -r --arg id "$id" '
              if $id=="exasol-personal" or $id=="exasol-cloud" then .personal.version
              elif $id=="exapump" then .exapump.version
              elif $id=="mcp-server" then .pythonStack.mcpServerVersion
              else empty end' apps/desktop/src-tauri/resources/runtime-components.lock.json 2>/dev/null || true)
            # "latest" = the REAL upstream release tag, for every item — the app
            # decides what to offer; the catalog never hides a newer release.
            latest="null"
            if [ -n "$repo" ]; then
              # No -f: a repo with no published release returns 404 with a JSON
              # body; jq then yields "null". Guard the whole pipe so set -e is happy.
              latest=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$repo/releases/latest" | jq -r '.tag_name // "null"') || latest="null"
            fi
            # A repo with no releases still surfaces its verified pin as latest.
            if [ "$latest" = "null" ] && [ -n "$verified" ] && [ "$verified" != "null" ]; then
              latest="$verified"
            fi
            # Repo name + About line, fetched authenticated (the app's own
            # unauthenticated calls rate-limit at 60/hr, so the catalog is the
            # reliable source of display metadata for marketplace cards).
            meta='{"name":null,"description":null}'
            if [ -n "$repo" ]; then
              meta=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$repo" | jq -c '{name: (.name // null), description: (.description // null)}') || meta='{"name":null,"description":null}'
            fi
            [ "$first" -eq 0 ] && echo ',' >> catalog.json
            first=0
            printf '    "%s": { "repo": "%s", "latest": %s, "verified": %s, "homepage": "%s", "name": %s, "description": %s }' \
              "$id" "$repo" "$(jq -Rn --arg v "$latest" 'if $v=="null" then null else $v end')" \
              "$(jq -Rn --arg v "$verified" 'if $v=="" or $v=="null" then null else $v end')" "$homepage" \
              "$(echo "$meta" | jq -c '.name')" "$(echo "$meta" | jq -c '.description')" >> catalog.json
          done <<< "$items"
          echo '' >> catalog.json
          echo '  }' >> catalog.json
          echo '}' >> catalog.json
          mkdir -p marketplace
          jq . catalog.json > marketplace/catalog.json
          rm -f catalog.json
          cat marketplace/catalog.json

      # main is protected (changes only via reviewed PRs), so the refreshed
      # catalog goes through a PR like the runtime-components refresh. Auto-merge
      # is requested so it lands as soon as a human approves — no extra step.
      - name: Publish catalog refresh for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketplace/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged — nothing to commit."
            exit 0
          fi
          branch="automation/catalog"
          git switch -c "$branch"
          git commit -m "chore: refresh marketplace catalog"
          # Plain --force: the branch is bot-owned scratch state, and a fresh clone
          # has no remote-tracking ref for --force-with-lease to verify against.
          git push --force --set-upstream origin "$branch"
          # Only an OPEN PR counts. `gh pr view <branch>` also matches CLOSED/MERGED
          # PRs from previous runs, which made this skip creating a new one and
          # silently leave the refresh unproposed. Check open PRs explicitly.
          pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: refresh marketplace catalog" \
              --body "Automated catalog refresh — \"latest\" is the real upstream release per item; \"verified\" carries the validated lock pin for managed components. Approve to land (auto-merge)." \
              | grep -oE '[0-9]+$' | tail -1)
          fi
          if [ -z "$pr" ]; then
            echo "::error::Could not open a catalog PR. Check that 'Allow GitHub Actions to create and approve pull requests' is enabled (Settings → Actions → General)."
            exit 1
          fi
          echo "Catalog refresh proposed in PR #$pr."
          gh pr merge "$pr" --auto --squash || echo "::warning::auto-merge not enabled — PR #$pr awaits review/merge."
